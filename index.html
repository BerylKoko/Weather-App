<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151f35"><title>Atmosphere — a little closer to the sky</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#fff;background:#101b2d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 10%,#7895ad 0,transparent 45%),linear-gradient(145deg,#182d4a,#17243b 55%,#0b1729);transition:background .5s}body.sunny{background:radial-gradient(ellipse at 80% 5%,#f3b77f,transparent 44%),linear-gradient(145deg,#628fb4,#486f9a 60%,#253c67)}body.rain{background:radial-gradient(ellipse at 80% 5%,#63798f,transparent 40%),linear-gradient(145deg,#253b52,#14283f 65%,#101b2d)}body.night{background:radial-gradient(ellipse at 75% 15%,#4b527f,transparent 40%),linear-gradient(145deg,#0b142d,#14213e 65%,#0b1223)}.shell{max-width:1150px;margin:auto;padding:36px 36px 70px}header,.top,.toolbar,.sectionhead,.day,.hour,.details{display:flex;align-items:center;justify-content:space-between;gap:16px}header{margin-bottom:70px}.brand{font-family:Manrope;font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:#d5e9ff}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:3px;opacity:.68;font-weight:700}.toolbar{gap:10px}button,input{font:inherit}button{cursor:pointer;border:1px solid #ffffff38;color:#fff;background:#ffffff17;border-radius:40px;padding:11px 16px}button:hover{background:#ffffff32}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.search{display:flex;align-items:center;gap:8px;background:#ffffff19;border:1px solid #ffffff38;border-radius:30px;padding:4px 6px 4px 17px}.search input{background:none;color:white;border:0;outline:none;width:190px}.search input::placeholder{color:#e0e6ee}.search button{background:#fff;color:#22324b;border:0}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;min-height:300px}.city{font:700 clamp(35px,5vw,66px)/1.05 Manrope;letter-spacing:-3px;margin:16px 0}.date{opacity:.8}.temperature{font:500 clamp(100px,15vw,190px)/1 Manrope;letter-spacing:-13px;margin:16px 0}.condition{font-size:24px}.visual{text-align:center;font-size:clamp(140px,19vw,250px);filter:drop-shadow(0 24px 45px #0003);animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-15px)}}.glass{background:#ffffff12;border:1px solid #ffffff2a;border-radius:25px;backdrop-filter:blur(20px);padding:26px}.sectionhead{margin:38px 0 18px}.sectionhead h2{font:700 18px Manrope;margin:0}.hours{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}.hour{flex-direction:column;justify-content:center;gap:12px;padding:17px 6px;background:#ffffff12;border-radius:18px}.hour .symbol{font-size:27px}.hour small{opacity:.7}.forecast{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.days{display:grid;gap:2px}.day{padding:14px 4px;border-bottom:1px solid #ffffff1a}.day:last-child{border:0}.day span:first-child{min-width:85px}.day .symbol{font-size:22px}.day .low{opacity:.65}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#ffffff0d;border-radius:17px;padding:17px}.metric strong{display:block;font:700 27px Manrope;margin-top:12px}.metric small{opacity:.7}footer{opacity:.6;font-size:12px;margin-top:30px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}a{color:inherit}.status{min-height:24px;color:#fff;opacity:.9;font-size:13px;margin-top:14px}.loading{opacity:.5}@media(max-width:760px){.shell{padding:22px 18px 40px}header{align-items:flex-start;gap:24px;flex-direction:column;margin-bottom:38px}.toolbar{width:100%;flex-wrap:wrap}.search{flex:1}.search input{width:100%;min-width:100px}.hero{grid-template-columns:1fr;min-height:0}.visual{font-size:110px;position:absolute;right:20px;top:215px;opacity:.75}.temperature{font-size:105px;letter-spacing:-8px}.city{font-size:40px;letter-spacing:-2px}.hours{display:flex;overflow-x:auto}.hour{min-width:88px}.forecast{grid-template-columns:1fr}.glass{padding:20px}}
</style></head><body><main class="shell"><header><div class="brand">atmosphere<span>.</span><div class="eyebrow" style="margin-top:6px">A little closer to the sky</div></div><div class="toolbar"><form class="search" id="search"><input id="query" aria-label="Search city" placeholder="Search a city..." required><button type="submit">Search ↗</button></form><button id="locate" title="Use my location" aria-label="Use my location">◎</button><button id="units" aria-label="Toggle temperature units">°F</button></div></header><div class="eyebrow">Your daily outlook</div><section class="hero"><div><h1 class="city" id="city">New York</h1><div class="date" id="date">Finding the forecast...</div><div class="temperature" id="temp">--°</div><div class="condition" id="condition">Just a moment</div><p id="feels" style="opacity:.8"></p></div><div class="visual" id="visual" aria-hidden="true">☀️</div></section><div class="status" id="status" role="status" aria-live="polite"></div><div class="sectionhead"><h2>The next 24 hours</h2><span class="eyebrow">Hourly outlook</span></div><section class="hours" id="hours" aria-label="Hourly forecast"></section><div class="sectionhead"><h2>A look ahead</h2><span class="eyebrow">7-day forecast</span></div><section class="forecast"><div class="glass days" id="days"></div><div class="glass"><div class="eyebrow" style="margin-bottom:16px">Outside, right now</div><div class="detailgrid" id="metrics"></div></div></section><footer><span>Made for moments under the same sky.</span><span>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Forecasts are estimates</span></footer></main><script>
const $=id=>document.getElementById(id);let unit=localStorage.getItem('atmosphere-unit')||'fahrenheit';let place={name:'New York',latitude:40.7128,longitude:-74.006};let weather=null;
const code=w=>w===0?['Clear skies','☀️']:w<=2?['Partly cloudy','🌤️']:w===3?['Overcast','☁️']:w<=48?['Misty','🌫️']:w<=67?['Rainy','🌧️']:w<=77?['Snowy','❄️']:w<=82?['Showers','🌦️']:w<=86?['Snow showers','🌨️']:['Thunderstorms','⛈️'];
const fmt=n=>Math.round(n)+'°',day=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}),time=s=>new Date(s).toLocaleTimeString('en-US',{hour:'numeric',hour12:true});
async function load(){ $('status').textContent='Updating your forecast…';try{let u=new URL('https://api.open-meteo.com/v1/forecast');Object.entries({latitude:place.latitude,longitude:place.longitude,current:'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day',hourly:'temperature_2m,precipitation_probability,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max',temperature_unit:unit,wind_speed_unit:'kmh',timezone:'auto',forecast_days:7}).forEach(([k,v])=>u.searchParams.set(k,v));let r=await fetch(u);if(!r.ok)throw Error('Weather service unavailable');weather=await r.json();render();$('status').textContent='Forecast updated · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(e){$('status').textContent='Could not load the forecast. Please try another city or refresh.';}}
function render(){let c=weather.current,d=weather.daily,h=weather.hourly;let [label,emoji]=code(c.weather_code);$('city').textContent=place.name;$('date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});$('temp').textContent=fmt(c.temperature_2m);$('condition').textContent=label;$('visual').textContent=c.is_day?emoji:(c.weather_code<=3?'🌙':emoji);$('feels').textContent='Feels like '+fmt(c.apparent_temperature)+' · High '+fmt(d.temperature_2m_max[0])+' / Low '+fmt(d.temperature_2m_min[0]);document.body.className=c.is_day?(c.weather_code===0?'sunny':c.weather_code>=51?'rain':''):'night';let now=h.time.findIndex(t=>t>=c.time.slice(0,13)+':00');now=Math.max(0,now);$('hours').innerHTML=Array.from({length:8},(_,i)=>{let k=Math.min(now+i*3,h.time.length-1);return '<div class="hour"><small>'+(i===0?'Now':time(h.time[k]))+'</small><span class="symbol">'+code(h.weather_code[k])[1]+'</span><strong>'+fmt(h.temperature_2m[k])+'</strong><small>☂ '+(h.precipitation_probability[k]??0)+'%</small></div>'}).join('');$('days').innerHTML=d.time.map((t,i)=>'<div class="day"><span>'+(i===0?'Today':day(t))+'</span><span class="symbol">'+code(d.weather_code[i])[1]+'</span><span style="flex:1;opacity:.8">'+code(d.weather_code[i])[0]+'</span><strong>'+fmt(d.temperature_2m_max[i])+'</strong><span class="low">'+fmt(d.temperature_2m_min[i])+'</span></div>').join('');let vals=[['Humidity',c.relative_humidity_2m+'%'],['Wind',Math.round(c.wind_speed_10m)+' km/h'],['Rain chance',(d.precipitation_probability_max[0]??0)+'%'],['Sunset',new Date(d.sunset[0]).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})]];$('metrics').innerHTML=vals.map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+v+'</strong></div>').join('');$('units').textContent=unit==='fahrenheit'?'°F':'°C'}
$('search').onsubmit=async e=>{e.preventDefault();let q=$('query').value.trim();if(!q)return;$('status').textContent='Searching for '+q+'…';try{let r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=en&format=json');let j=await r.json();if(!j.results?.length)throw Error();let p=j.results[0];place={name:p.name+(p.country?', '+p.country:''),latitude:p.latitude,longitude:p.longitude};await load();}catch(e){$('status').textContent='City not found. Try a different spelling.'}};
$('units').onclick=()=>{unit=unit==='fahrenheit'?'celsius':'fahrenheit';localStorage.setItem('atmosphere-unit',unit);load()};
$('locate').onclick=()=>{if(!navigator.geolocation){$('status').textContent='Location is not available in this browser.';return}navigator.geolocation.getCurrentPosition(p=>{place={name:'Your location',latitude:p.coords.latitude,longitude:p.coords.longitude};load()},()=>{$('status').textContent='Location access was declined. You can search by city instead.'},{timeout:10000})};load();
</script></body></html>
